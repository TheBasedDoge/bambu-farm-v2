%dev.quarkus.mqtt.devservices.enabled=false

quarkus.scheduler.start-mode=forced
quarkus.http.enable-compression=true
quarkus.http.limits.max-body-size=20M

quarkus.rest-client.cloud.url=https://bambulab.com/

# MCP server for agents (docs/MCP-PLAN.md). Access is checked by com.tfyre.bambu.mcp.McpAccessFilter.
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=BambuFarm
# Second, smaller MCP server for local models (docs/MCP-PLAN.md): tools in com.tfyre.bambu.mcp.LiteTools.
quarkus.mcp.server.lite.http.root-path=/mcp-lite
quarkus.mcp.server.lite.server-info.name=BambuFarm Lite
