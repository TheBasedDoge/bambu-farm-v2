# nginx front door for the farm, as actually run in production (2026-09): TLS on 443 (published as 8081 by
# compose.yml), the HLS route the camera fallback needs, and Docker's internal resolver so nginx survives a
# container restart instead of dying on "host not found". Replace YOUR_HOSTNAME; the certs are mounted by
# compose.yml as /etc/nginx/certs/{cert,key}.pem.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 443 ssl;
    server_name YOUR_HOSTNAME;   # the public name on your TLS certificate

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    access_log off;

    # Use Docker's internal DNS so nginx resolves upstreams per-request
    # instead of at startup — prevents "host not found" crashes on restart
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HLS playlists and segments → mediamtx HLS server (port 8888, internal Docker only)
    location /_hlsstream/ {
        set $mediamtx_hls http://mediamtx:8888;
        rewrite ^/_hlsstream/(.*) /$1 break;
        proxy_pass $mediamtx_hls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    # WHEP signaling, WebRTC API, and mediamtx web player → port 8889
    location /_camerastream/ {
        set $mediamtx_upstream http://mediamtx:8889;
        rewrite /_camerastream/(.*) /$1 break;
        proxy_redirect / /_camerastream/;
        absolute_redirect off;
        proxy_pass $mediamtx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;
    }

    location / {
        set $bambuweb_upstream http://bambuweb:8080;
        client_max_body_size 20m;
        proxy_pass $bambuweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;
    }
}