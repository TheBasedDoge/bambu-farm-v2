# nginx front door for the farm, as actually run in production (2026-09): TLS on 443 (published as 8081 by
# compose.yml), the HLS route the camera fallback needs, and Docker's internal resolver so nginx survives a
# container restart instead of dying on "host not found". Replace YOUR_HOSTNAME; the certs are mounted by
# compose.yml as /etc/nginx/certs/{cert,key}.pem.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_HOSTNAME;   # the public name on your TLS certificate

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    access_log off;

    # Compress the app's scripts, styles and JSON (from upstream TFyre/bambu-farm 6f9e50d)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Use Docker's internal DNS so nginx resolves upstreams per-request
    # instead of at startup — prevents "host not found" crashes on restart
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HLS playlists and segments → mediamtx HLS server (port 8888, internal Docker only)
    location /_hlsstream/ {
        set $mediamtx_hls http://mediamtx:8888;
        rewrite ^/_hlsstream/(.*) /$1 break;
        proxy_pass $mediamtx_hls;
        # mediamtx 1.21 answers the first playlist request with a cookie-check redirect to /<path>/...;
        # put the /_hlsstream/ prefix back or the player follows it straight to the app
        proxy_redirect / /_hlsstream/;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    # WHEP signaling, WebRTC API, and mediamtx web player → port 8889
    location /_camerastream/ {
        set $mediamtx_upstream http://mediamtx:8889;
        rewrite /_camerastream/(.*) /$1 break;
        proxy_redirect / /_camerastream/;
        absolute_redirect off;
        proxy_pass $mediamtx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;
    }

    # MCP endpoint for agents (docs/MCP-PLAN.md). The app checks the bearer token itself; responses can stream
    # (Streamable HTTP / SSE), so nginx must not buffer them.
    location /mcp {
        set $bambuweb_upstream http://bambuweb:8080;
        proxy_pass $bambuweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 5m;
    }

    location / {
        set $bambuweb_upstream http://bambuweb:8080;
        client_max_body_size 20m;
        proxy_pass $bambuweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;

        # Camera thumbnails are bigger than the default 8x4k proxy buffers, so nginx wrote each one to a
        # temp file and read it back. Buffers grow lazily, so the higher ceiling costs nothing for small ones.
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
    }
}