services:
    mediamtx:
        # Docker Hub tags have no 'v' prefix (GitHub release v1.21.2 = image 1.21.2)
        image: bluenviron/mediamtx:1.21.2
        restart: always
        volumes:
            - ./mediamtx.yml:/mediamtx.yml
        # mediamtx.yml is a verbatim copy of upstream mediamtx's file, so it can be replaced on a version
        # bump. mediamtx reads MTX_* variables AFTER it, so every local setting lives in env files:
        #   mediamtx.env - WebRTC address, HLS variant, source transport
        #   printers.env - one path per RTSPS printer, generated by ./build-printers-env.sh from printers.list
        env_file:
            - mediamtx.env
            - printers.env
        ports:
            #RTSP
            #- '8554:8554' 

            #WebRTC
            - '8189:8189/tcp'
            - '8189:8189/udp'
            #- '8888:8888'
            - '8889:8889'

    bambuweb:
        image: azul/zulu-openjdk:21-latest
        restart: always
        environment:
            # Without this the container runs in UTC, and anything the app reasons about by CALENDAR DAY is
            # wrong for you: the "Today" counter rolls over mid-evening, History groups by the wrong day, and
            # a daily-summary cron set for 07:00 fires at 07:00 UTC. Set it to your own zone.
            TZ: America/New_York
        volumes:
            - ./bambu-web-X.X.X-runner.jar:/bambu-web-runner.jar
            - ./bambu-web-env.txt:/.env
        ports:
            - '8081:8080'
        entrypoint: /usr/bin/java -Djdk.tls.useExtendedMasterSecret=false -jar bambu-web-runner.jar

    nginx:
        image: nginx:1.26-alpine
        restart: always
        volumes:
            - ./reverse-proxy.conf:/etc/nginx/conf.d/default.conf
        ports:
            - '8080:80'
        depends_on:
            - mediamtx
            - bambuweb

    # RTSPS printers (X1C/X1E/H2D) are no longer containers: mediamtx pulls each one itself, with a real
    # read deadline and automatic reconnect - the old per-printer ffmpeg containers could freeze with zero
    # frames while looking healthy. Add them to printers.list and run ./build-printers-env.sh.
